name: Generate Games Index & Commit Info

on:
  push:
    paths-ignore:
      - 'games.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build games.json with Commit Details
        run: |
          # Extract commit metadata from Git log
          COMMIT_HASH=$(git log -1 --format="%h")
          AUTHOR_NAME=$(git log -1 --format="%an")
          COMMIT_DATE=$(git log -1 --format="%cd" --date=relative)
          COMMIT_TITLE=$(git log -1 --format="%s")
          COMMIT_DESC=$(git log -1 --format="%b")

          python3 -c "
          import os, json

          catalog = {}
          for section in ['single', 'multi', 'special']:
              if os.path.isdir(section):
                  folders = sorted([
                      d for d in os.listdir(section)
                      if os.path.isdir(os.path.join(section, d)) and not d.startswith('.')
                  ])
                  catalog[section] = folders
              else:
                  catalog[section] = []

          # Append last commit object
          catalog['last_commit'] = {
              'hash': '''$COMMIT_HASH'''.strip(),
              'author': '''$AUTHOR_NAME'''.strip(),
              'time': '''$COMMIT_DATE'''.strip(),
              'name': '''$COMMIT_TITLE'''.strip(),
              'description': '''$COMMIT_DESC'''.strip()
          }

          with open('games.json', 'w', encoding='utf-8') as f:
              json.dump(catalog, f, indent=2)
          "

      - name: Commit and Push games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Auto-update games.json with latest commit info [skip ci]" || echo "No changes to commit"
          git push
