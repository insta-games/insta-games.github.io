name: Generate Games Index

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'single/**'
      - 'multi/**'
      - 'special/**'
      - 'desc.epic'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build games.json
        run: |
          python3 -c "
          import os, json

          catalog = {}
          for section in ['single', 'multi', 'special']:
              if os.path.isdir(section):
                  folders = sorted([
                      d for d in os.listdir(section)
                      if os.path.isdir(os.path.join(section, d)) and not d.startswith('.')
                  ])
                  catalog[section] = folders
              else:
                  catalog[section] = []

          with open('games.json', 'w', encoding='utf-8') as f:
              json.dump(catalog, f, indent=2)
          "

      - name: Commit and Push games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Auto-generate games.json [skip ci]" || echo "No changes to commit"
          git push
