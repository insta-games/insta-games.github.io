name: Generate Games Index & Full Commit History

on:
  push:
    paths-ignore:
      - 'games.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout entire repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build games.json with Full History
        run: |
          python3 -c "
          import os, json, subprocess

          catalog = {}
          for section in ['single', 'multi', 'special']:
              if os.path.isdir(section):
                  folders = sorted([
                      d for d in os.listdir(section)
                      if os.path.isdir(os.path.join(section, d)) and not d.startswith('.')
                  ])
                  catalog[section] = folders
              else:
                  catalog[section] = []

          # Detect repository URL dynamically
          repo_url = os.environ.get('GITHUB_SERVER_URL', 'https://github.com') + '/' + os.environ.get('GITHUB_REPOSITORY', 'insta-games/insta-games.github.io')
          catalog['repo_url'] = repo_url

          # Pull ALL commits without limit
          # %h: short hash, %an: author, %ct: Unix timestamp, %s: subject, %b: body
          delimiter = '---COMMIT_DELIMITER_TAG---'
          record_sep = '---FIELD_SEPARATOR_TAG---'
          git_format = f'{record_sep}%h{record_sep}%an{record_sep}%ct{record_sep}%s{record_sep}%b{delimiter}'
          
          cmd = ['git', 'log', f'--format={git_format}']
          raw_log = subprocess.check_output(cmd, text=True, errors='replace')

          commits = []
          for entry in raw_log.split(delimiter):
              entry = entry.strip()
              if not entry:
                  continue
              parts = entry.split(record_sep)
              if len(parts) >= 5:
                  h = parts[1].strip()
                  author = parts[2].strip()
                  raw_time = parts[3].strip()
                  title = parts[4].strip()
                  desc = parts[5].strip() if len(parts) > 5 else ''
                  
                  try:
                      timestamp_int = int(raw_time)
                  except ValueError:
                      timestamp_int = 0

                  commits.append({
                      'hash': h,
                      'author': author,
                      'unix_time': timestamp_int,
                      'name': title,
                      'description': desc
                  })

          catalog['commits'] = commits
          catalog['last_commit'] = commits[0] if commits else None

          with open('games.json', 'w', encoding='utf-8') as f:
              json.dump(catalog, f, indent=2, ensure_ascii=False)
          print(f'Successfully exported {len(commits)} commits to games.json')
          "

      - name: Commit and Push games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Auto-update full commit history [skip ci]" || echo "No changes to commit"
          git push
