        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);

<body>
  <!-- Custom Liquid Glass Link Preview Bubble -->
  <div id="custom-status-bubble">
    <span id="custom-status-bubble-text"></span>
  </div>

  <header class="site-header shadow">

        <a href="javascript:void(0)" id="nav-local-multiplayer">Local Multiplayer</a>

      </nav>
    </div>

  <!-- Header Ad Placeholder -->

  <!-- Full Page Content -->
  <main class="container">
    <!-- Single Player Section -->
    <section class="features" id="section-singleplayer">
      <h2>Single Player Games</h2>
      <div class="grid" id="grid-singleplayer">
        <div class="empty-state">No games found.</div>
      </div>
    </section>

    <!-- Local Multiplayer Section -->
    <section class="features" id="section-local-multiplayer" style="display:none;">
      <h2>Local Multiplayer Games</h2>
      <div class="grid" id="grid-local-multiplayer">
        <div class="empty-state">No games found.</div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <small>&copy; <span id="year"></span> Insta-Games |
        <a href="privacy/" style="color: var(--accent); text-decoration: none;">Privacy Policy</a> |
        <a href="terms/" style="color: var(--accent); text-decoration: none;">Terms of Service</a> |
        <a href="about/" style="color: var(--accent); text-decoration: none;">About</a> |
        <a href="feedback/" style="color: var(--accent); text-decoration: none;">Feedback</a>
      </small>
    </div>
  </footer>

  <!-- Visual Background & Effects Scripts -->
  <script src="three.min.js"></script>
  <script src="glass-header.js"></script>
  <script src="shared.js"></script>

  <script>
    /* ============================================================================
       1. Custom Liquid Glass Status Bubble Logic
       ========================================================================== */
    const statusBubble = document.getElementById('custom-status-bubble');
    const statusBubbleText = document.getElementById('custom-status-bubble-text');

    function showStatusBubble(relativeUrl) {
      if (!statusBubble || !statusBubbleText) return;
      const resolved = new URL(relativeUrl, window.location.href).href;
      statusBubbleText.textContent = resolved;
      statusBubble.classList.add('visible');
    }

    function hideStatusBubble() {
      if (!statusBubble) return;
      statusBubble.classList.remove('visible');
    }

    function navigateTo(url, event) {
      if (event && (event.ctrlKey || event.metaKey || event.button === 1)) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        window.location.href = url;
      }
    }

    /* ==========================================================================
       3. Nav Tab Controls
       ========================================================================== */
    document.getElementById('year').textContent = new Date().getFullYear();

    const navToggle = document.getElementById('nav-toggle');
    const siteNav = document.getElementById('site-nav');
    if (navToggle && siteNav) {
      navToggle.addEventListener('click', () => {
        siteNav.classList.toggle('open');
      });
    }

    const tabs = [
      { nav: document.getElementById('nav-singleplayer'), sec: document.getElementById('section-singleplayer') },
      { nav: document.getElementById('nav-local-multiplayer'), sec: document.getElementById('section-local-multiplayer') }
    ];

    tabs.forEach(tab => {
      if (!tab.nav || !tab.sec) return;
      tab.nav.addEventListener('click', () => {
        tabs.forEach(t => {
          if (t.nav) t.nav.classList.remove('active');
          if (t.sec) t.sec.style.display = 'none';
        });
        tab.nav.classList.add('active');
        tab.sec.style.display = 'block';
        if (siteNav && window.innerWidth <= 768) siteNav.classList.remove('open');
      });
    });

    /* ==========================================================================
       4. Game Indexing & Button Rendering
       ========================================================================== */
    function formatDirName(name) {
      return name.replace(/[-_]/g, ' ').replace(/connect4/gi, 'connect 4').replace(/\b\w/g, c => c.toUpperCase());
    }

    function normalizeKey(str) {
      return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    async function loadEpicDescriptions() {
      const descriptions = new Map();
      try {
        const res = await fetch('./desc.epic');
        if (!res.ok) return descriptions;
        const text = await res.text();
        const regex = /["'*]([^"'*]+)["'*]\s+has\s+description\s+["'*]([^"'*]*)["'*]/gi;
        let match;
        while ((match = regex.exec(text)) !== null) {
          const rawName = match[1].trim();
          const desc = match[2].trim();
          descriptions.set(normalizeKey(rawName), desc);
          descriptions.set(rawName.toLowerCase(), desc);
        }
      } catch (e) {
        console.warn('desc.epic could not be loaded:', e);
      }
      return descriptions;
    }

    async function loadGamesCatalog() {
      try {
        const res = await fetch('./games.json');
        if (res.ok) return await res.json();
      } catch (e) {
        console.warn('games.json could not be loaded:', e);
      }
      return { single: [], multi: [], special: [] };
    }

    function renderCategory(dirs, folder, gridId, descMap, append = false) {
      const grid = document.getElementById(gridId);
      if (!grid) return;

      if (!dirs || dirs.length === 0) {
        if (!append) grid.innerHTML = '<div class="empty-state">No games found.</div>';
        return;
      }

      if (!append) grid.innerHTML = '';

      for (const dir of dirs) {
        const title = formatDirName(dir);
        const desc = descMap.get(normalizeKey(dir)) ||
          descMap.get(normalizeKey(title)) ||
          descMap.get(dir.toLowerCase()) ||
          descMap.get(title.toLowerCase()) ||
          '';

        const gameUrl = `${folder}/${dir}/`;

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <h3>${title}</h3>
          <p class="desc">${desc}</p>
          <p>
            <button 
              type="button" 
              class="btn" 
              data-target-url="${gameUrl}">
              Play
            </button>
          </p>
        `;

        const btn = card.querySelector('button.btn');
        btn.addEventListener('mouseenter', () => showStatusBubble(gameUrl));
        btn.addEventListener('mouseleave', hideStatusBubble);
        btn.addEventListener('click', (e) => navigateTo(gameUrl, e));
        btn.addEventListener('auxclick', (e) => {
          if (e.button === 1) navigateTo(gameUrl, e);
        });

        grid.appendChild(card);
      }
    }

    /* ==========================================================================
       5. Initialize Page
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      const [descMap, catalog] = await Promise.all([
        loadEpicDescriptions(),
        loadGamesCatalog()
      ]);

      renderCategory(catalog.single || [], 'single', 'grid-singleplayer', descMap);
      renderCategory(catalog.multi || [], 'multi', 'grid-local-multiplayer', descMap);
      renderCategory(catalog.special || [], 'special', 'grid-singleplayer', descMap, true);
    });
  </script>
</body>
