  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Mobile nav toggle
    const navToggle = document.getElementById('nav-toggle');
    const siteNav = document.getElementById('site-nav');
    if (navToggle && siteNav) {
      navToggle.addEventListener('click', () => {
        siteNav.classList.toggle('open');
      });
    }

    // Navigation Tab Switching
    const tabs = [
      { nav: document.getElementById('nav-singleplayer'), sec: document.getElementById('section-singleplayer') },
      { nav: document.getElementById('nav-local-multiplayer'), sec: document.getElementById('section-local-multiplayer') },
      { nav: document.getElementById('nav-special'), sec: document.getElementById('section-special') }
    ];

    tabs.forEach(tab => {
      if (!tab.nav || !tab.sec) return;
      tab.nav.addEventListener('click', () => {
        tabs.forEach(t => {
          if (t.nav) t.nav.classList.remove('active');
          if (t.sec) t.sec.style.display = 'none';
        });
        tab.nav.classList.add('active');
        tab.sec.style.display = 'block';
        if (siteNav && window.innerWidth <= 768) siteNav.classList.remove('open');
      });
    });

    // Clean title formatter
    function formatDirName(name) {
      return name.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    // Alphanumeric normalizer for resilient map matching
    function normalizeKey(str) {
      return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // Parse root desc.epic file
    async function loadEpicDescriptions() {
      const descriptions = new Map();
      try {
        const res = await fetch('./desc.epic');
        if (!res.ok) {
          console.warn('desc.epic not found (HTTP status:', res.status, ')');
          return descriptions;
        }
        const text = await res.text();

        // Supports double quotes, single quotes, or asterisks as delimiters
        const regex = /["'*]([^"'*]+)["'*]\s+has\s+description\s+["'*]([^"'*]*)["'*]/gi;
        let match;
        while ((match = regex.exec(text)) !== null) {
          const rawName = match[1].trim();
          const desc = match[2].trim();

          descriptions.set(normalizeKey(rawName), desc);
          descriptions.set(rawName.toLowerCase(), desc);
        }
      } catch (e) {
        console.error('Error fetching or parsing desc.epic:', e);
      }
      return descriptions;
    }

    // Discover existing directories under target folder
    async function discoverDirectories(folder) {
      let folders = new Set();

      // 1. GitHub Tree API check (for insta-games.github.io)
      try {
        const res = await fetch('https://api.github.com/repos/insta-games/insta-games.github.io/git/trees/main?recursive=1');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.tree)) {
            const prefix = folder + '/';
            data.tree.forEach(item => {
              if (item.path.startsWith(prefix)) {
                const subPath = item.path.slice(prefix.length);
                const parts = subPath.split('/');
                if (parts.length >= 2 || (parts.length === 1 && item.type === 'tree')) {
                  if (parts[0] && !parts[0].startsWith('.')) {
                    folders.add(parts[0]);
                  }
                }
              }
            });
            return Array.from(folders);
          }
        }
      } catch (e) { }

      // 2. Directory auto-index scraping (for local test servers)
      try {
        const res = await fetch(folder + '/');
        if (res.ok) {
          const text = await res.text();
          const matches = [...text.matchAll(/href="([^"?#/]+)\/?"/gi)];
          matches.forEach(m => {
            const name = m[1];
            if (name && name !== '..' && name !== '.' && !name.includes('.') && !name.includes(':')) {
              folders.add(name);
            }
          });
        }
      } catch (e) { }

      return Array.from(folders);
    }

    // Scan, match descriptions, and render cards
    async function scanCategory(folder, gridId, descMap) {
      const grid = document.getElementById(gridId);
      if (!grid) return;

      const dirs = await discoverDirectories(folder);

      if (!dirs || dirs.length === 0) {
        grid.innerHTML = '<div class="empty-state">No games found.</div>';
        return;
      }

      grid.innerHTML = '';

      for (const dir of dirs) {
        const title = formatDirName(dir);

        // Try directory slug, formatted title, and stripped variants
        const desc = descMap.get(normalizeKey(dir)) ||
          descMap.get(normalizeKey(title)) ||
          descMap.get(dir.toLowerCase()) ||
          descMap.get(title.toLowerCase()) ||
          '';

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <h3>${title}</h3>
          ${desc ? `<p class="desc">${desc}</p>` : `<p class="desc"></p>`}
          <p><a class="btn" href="${folder}/${dir}/">Play</a></p>
        `;
        grid.appendChild(card);
      }
    }

    // Run scans when DOM is fully loaded
    window.addEventListener('DOMContentLoaded', async () => {
      const descMap = await loadEpicDescriptions();
      scanCategory('single', 'grid-singleplayer', descMap);
      scanCategory('multi', 'grid-local-multiplayer', descMap);
      scanCategory('special', 'grid-special', descMap);
    });
  </script>
