<!doctype html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->

    <script>
        window.dataLayer = window.dataLayer || [];

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Commit History - Insta-Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />

    <style>
        .history-wrap {
            max-width: 900px;
            margin: 3.5rem auto;
            padding: 2.5rem 2rem;
            background: rgba(14, 20, 40, 0.45);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: var(--radius);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.38),
                inset 0 -1px 0 rgba(255, 255, 255, 0.06),
                0 20px 60px rgba(0, 0, 0, 0.55);
            position: relative;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .history-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
        }

        .history-stats {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.3rem;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 400px;
        }

        .commit-item {
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }

        .commit-item:hover {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(17, 24, 39, 0.7);
        }

        .commit-item.open {
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .commit-summary {
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            user-select: none;
        }

        .commit-summary-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
            flex: 1;
        }

        .commit-summary-title {
            font-weight: 600;
            color: #fff;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .commit-summary-right {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            white-space: nowrap;
        }

        .commit-time {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .chevron {
            font-size: 0.75rem;
            color: var(--muted);
            transition: transform 0.25s ease;
        }

        .commit-item.open .chevron {
            transform: rotate(180deg);
            color: var(--accent);
        }

        /* Expandable Body */
        .commit-details {
            display: none;
            padding: 0 1.25rem 1.25rem 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(10, 14, 26, 0.3);
        }

        .commit-item.open .commit-details {
            display: block;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.85rem;
            padding: 1rem 0;
        }

        .details-box label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 0.2rem;
        }

        .details-box span,
        .details-box a {
            font-size: 0.875rem;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        .details-box a:hover {
            color: var(--accent);
        }

        .details-body {
            margin-top: 0.5rem;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            font-size: 0.85rem;
            color: rgba(220, 225, 235, 0.85);
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .details-actions {
            margin-top: 1rem;
            display: flex;
            justify-content: flex-end;
        }

        /* Pagination Bar */
        .pagination-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .page-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(6, 182, 212, 0.5);
        }

        .page-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.85rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header class="site-header shadow">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <img src="assets/favicon.png" alt="favico" class="favico" onerror="this.style.display='none'" />
                <span class="brand-text">Insta-Games</span>
            </a>
            <nav class="site-nav">
                <a href="index.html">← Back to Games</a>
                <a href="commit.html" class="active">Commit History</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="history-wrap">
            <div class="history-header">
                <div>
                    <h1 class="history-title">Commit History</h1>
                    <p class="history-stats" id="history-stats">Loading commit logs...</p>
                </div>
                <a class="btn" href="https://github.com/insta-games/insta-games.github.io/commits/main" target="_blank"
                    rel="noopener noreferrer">
                    View on GitHub
                </a>
            </div>

            <div id="timeline" class="timeline">
                <div class="empty-state">Loading commits...</div>
            </div>

            <!-- Pagination Footer -->
            <div class="pagination-bar" id="pagination-bar" style="display: none;">
                <span class="page-info" id="page-info"></span>
                <div class="page-controls" id="page-controls"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <small>&copy; <span id="year"></span> Insta-Games | <a href="index.html"
                    style="color: var(--accent); text-decoration: none;">Home</a></small>
        </div>
    </footer>

    <script src="three.min.js"></script>
    <script src="silk-bg.js"></script>
    <script src="glass-header.js"></script>
    <script src="shared.js"></script>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const COMMITS_PER_PAGE = 15;
        let allCommits = [];
        let currentPage = 1;

        // Calculates real-time difference between commit timestamp and current clock
        function timeAgo(isoDateString) {
            if (!isoDateString) return 'recently';
            const past = new Date(isoDateString);
            if (isNaN(past.getTime())) return isoDateString;

            const now = new Date();
            const diffSeconds = Math.max(0, Math.floor((now - past) / 1000));

            if (diffSeconds < 45) return 'just now';

            const diffMinutes = Math.floor(diffSeconds / 60);
            if (diffMinutes < 60) return `${diffMinutes}m ago`;

            const diffHours = Math.floor(diffMinutes / 60);
            if (diffHours < 24) return `${diffHours}h ago`;

            const diffDays = Math.floor(diffHours / 24);
            if (diffDays < 30) return `${diffDays}d ago`;

            const diffMonths = Math.floor(diffDays / 30);
            if (diffMonths < 12) return `${diffMonths}mo ago`;

            const diffYears = Math.floor(diffDays / 365);
            return `${diffYears}y ago`;
        }

        function renderPage(page) {
            currentPage = page;
            const container = document.getElementById('timeline');
            container.innerHTML = '';

            const startIndex = (page - 1) * COMMITS_PER_PAGE;
            const endIndex = Math.min(startIndex + COMMITS_PER_PAGE, allCommits.length);
            const pageSlice = allCommits.slice(startIndex, endIndex);

            pageSlice.forEach((c, index) => {
                const item = document.createElement('div');
                item.className = 'commit-item';

                const commitUrl = `https://github.com/insta-games/insta-games.github.io/commit/${c.hash}`;
                const relativeTime = timeAgo(c.timestamp);
                const fullDate = c.timestamp ? new Date(c.timestamp).toLocaleString() : 'Unknown date';

                item.innerHTML = `
          <div class="commit-summary">
            <div class="commit-summary-left">
              <span class="commit-dot" style="${(startIndex + index === 0) ? '' : 'background: #64748b; box-shadow: none;'}"></span>
              <span class="commit-summary-title">${c.name}</span>
              <span class="commit-code">${c.hash}</span>
            </div>
            <div class="commit-summary-right">
              <span class="commit-time">${relativeTime}</span>
              <span class="chevron">▼</span>
            </div>
          </div>

          <div class="commit-details">
            <div class="details-grid">
              <div class="details-box">
                <label>Author</label>
                <span class="commit-highlight">${c.author}</span>
              </div>
              <div class="details-box">
                <label>Date & Time</label>
                <span>${fullDate} (${relativeTime})</span>
              </div>
              <div class="details-box">
                <label>Full Commit Link</label>
                <a href="${commitUrl}" target="_blank" rel="noopener noreferrer">github.com/${c.hash}</a>
              </div>
            </div>

            ${c.description ? `
              <label style="font-size: 0.7rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; display: block; margin-top: 0.5rem;">Extended Description</label>
              <div class="details-body">${c.description}</div>
            ` : ''}

            <div class="details-actions">
              <a class="btn" href="${commitUrl}" target="_blank" rel="noopener noreferrer">
                Inspect Commit on GitHub →
              </a>
            </div>
          </div>
        `;

                item.querySelector('.commit-summary').addEventListener('click', () => {
                    item.classList.toggle('open');
                });

                container.appendChild(item);
            });

            renderPaginationControls();
        }

        function renderPaginationControls() {
            const totalPages = Math.ceil(allCommits.length / COMMITS_PER_PAGE) || 1;
            const paginationBar = document.getElementById('pagination-bar');
            const pageInfo = document.getElementById('page-info');
            const controls = document.getElementById('page-controls');

            if (totalPages <= 1) {
                paginationBar.style.display = 'none';
                return;
            }

            paginationBar.style.display = 'flex';
            pageInfo.textContent = `Showing ${(currentPage - 1) * COMMITS_PER_PAGE + 1} - ${Math.min(currentPage * COMMITS_PER_PAGE, allCommits.length)} of ${allCommits.length} commits`;

            controls.innerHTML = '';

            // Prev Button
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '← Prev';
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => renderPage(currentPage - 1));
            controls.appendChild(prevBtn);

            // Page numbers (smart window around current page)
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const numBtn = document.createElement('button');
                    numBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                    numBtn.textContent = i;
                    numBtn.addEventListener('click', () => renderPage(i));
                    controls.appendChild(numBtn);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    const dots = document.createElement('span');
                    dots.style.color = 'var(--muted)';
                    dots.style.padding = '0 0.3rem';
                    dots.textContent = '…';
                    controls.appendChild(dots);
                }
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = 'Next →';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => renderPage(currentPage + 1));
            controls.appendChild(nextBtn);
        }

        async function initHistory() {
            try {
                const res = await fetch('./games.json');
                if (!res.ok) throw new Error('Could not fetch games.json');
                const data = await res.json();

                allCommits = data.commits || (data.last_commit ? [data.last_commit] : []);

                if (allCommits.length === 0) {
                    document.getElementById('timeline').innerHTML = '<div class="empty-state">No commits found in log.</div>';
                    document.getElementById('history-stats').textContent = '0 total commits';
                    return;
                }

                document.getElementById('history-stats').textContent = `${allCommits.length} total commits recorded across the project.`;
                renderPage(1);
            } catch (err) {
                console.warn(err);
                document.getElementById('timeline').innerHTML = '<div class="empty-state">Failed to load commit log.</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', initHistory);
    </script>
</body>

</html>
